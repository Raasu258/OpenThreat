version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly }
    cooldown:          # majors only after 14 days: early regressions are usually fixed by then
      default-days: 3
      semver-major-days: 14
    groups:
      python-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    cooldown:          # majors only after 14 days: early regressions are usually fixed by then
      default-days: 3
      semver-major-days: 14
    groups:
      npm-minor:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/, /frontend]
    schedule: { interval: monthly }
    cooldown: { default-days: 14 }

  # Keeps the SHA-pinned actions in .github/workflows/images.yml current
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions:
        patterns: ["*"]
