version: 2
updates:
  - package-ecosystem: pip
    directory: /
    target-branch: deploy
    schedule: { interval: weekly }
    groups:
      python-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    target-branch: deploy
    schedule: { interval: weekly }
    groups:
      npm-minor:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/, /frontend]
    target-branch: deploy
    schedule: { interval: monthly }