# Audit, test and build the OpenThreat images; publish them to GHCR on
# pushes to `main`. The VPS pulls `sha-<commit>` images on its own
# (deploy/deploy.sh via a systemd timer) - nothing here can reach the VPS.
#
# Third-party actions are pinned to commit SHAs (tags can be moved);
# Dependabot (github-actions ecosystem) keeps the pins current.

name: Images

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: pip-audit (backend)
        run: |
          python -m pip install --quiet pip-audit
          pip-audit -r requirements.txt

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: npm audit (frontend, production deps)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  test:
    name: Tests + integration smoke test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: openthreat
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PG_URL: postgresql://postgres:postgres@localhost:5432/openthreat
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/openthreat
      REDIS_URL: redis://localhost:6379
      SECRET_KEY: ci-only-secret-key-0123456789abcdef0123456789
      CSRF_SECRET_KEY: ci-only-csrf-key-0123456789abcdef
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: |
          python -m pip install --quiet -r requirements.txt
          python -m pip install --quiet pytest pytest-asyncio pytest-cov pytest-mock httpx faker requests-mock

      # The legacy suite uses SQLite, which can't build the pg_trgm indexes,
      # so only the suites that run cleanly are gating here. The smoke test
      # below covers the app against real Postgres.
      - name: Unit tests
        run: python -m pytest -p no:cacheprovider --no-cov tests/test_run_migrations.py tests/test_auth_tokens.py tests/test_dependabot_update_type.py

      - name: Integration smoke test (Postgres + Redis)
        run: scripts/ci/smoke.sh

  stack:
    name: Full-stack test (compose)
    needs: [audit, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Same Dockerfiles and cache scopes as the publish job below, so that
      # job mostly reuses these layers.
      - name: Build backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.prod
          load: true
          provenance: false
          tags: ghcr.io/ci/openthreat-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          file: frontend/Dockerfile.prod
          load: true
          provenance: false
          tags: ghcr.io/ci/openthreat-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Run the stack and test it through nginx
        env:
          OT_REGISTRY: ghcr.io/ci
          OT_IMAGE_TAG: ci
        run: scripts/ci/stack-test.sh

  deploy:
    name: VPS deploy (Quadlet, migration, rollback)
    needs: [audit, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Same cache scopes as images.yml
      - name: Build backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.prod
          load: true
          provenance: false
          tags: ci/openthreat-backend:test
          cache-from: type=gha,scope=backend

      - name: Build frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          file: frontend/Dockerfile.prod
          load: true
          provenance: false
          tags: ci/openthreat-frontend:test
          cache-from: type=gha,scope=frontend

      - name: Rootless Podman + systemd user session
        run: |
          sudo apt-get install -y -q podman netavark aardvark-dns slirp4netns uidmap >/dev/null
          # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor
          sudo sysctl -q -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          grep -q "^$USER:" /etc/subuid || sudo usermod --add-subuids 200000-265535 --add-subgids 200000-265535 "$USER"
          sudo loginctl enable-linger "$USER"
          for _ in $(seq 1 30); do [ -S "/run/user/$(id -u)/bus" ] && break; sleep 1; done
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          podman system migrate
          podman info --format 'podman {{.Version.Version}}, network {{.Host.NetworkBackend}}, rootless {{.Host.Security.Rootless}}'
          systemctl --user is-system-running || true

      - name: Install, deploy, rollback, crash and restart scenarios
        env:
          SRC_BACKEND_IMAGE: ci/openthreat-backend:test
          SRC_FRONTEND_IMAGE: ci/openthreat-frontend:test
        run: scripts/ci/deploy-test.sh

  images:
    name: Image ${{ matrix.name }}
    # Nothing is published - and so nothing reaches the VPS - unless the
    # full stack AND the VPS deployment (install, deploy, rollback) work.
    needs: [stack, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # provenance attestation
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: backend
            context: .
            file: Dockerfile.prod
          - name: frontend
            context: frontend
            file: frontend/Dockerfile.prod
    env:
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Image name (GHCR needs lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/openthreat-${{ matrix.name }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - if: env.PUSH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: mode=max
          sbom: true

      - if: env.PUSH == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
