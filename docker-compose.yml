# OpenThreat production stack (rootless Podman + podman-compose on the VPS).
#
# Application images are built by GitHub Actions (.github/workflows/images.yml)
# and pulled from GHCR; deploy/deploy.sh pins OT_IMAGE_TAG to the commit
# being deployed. To build locally instead:
#   podman build -t ghcr.io/<owner>/openthreat-backend:local -f Dockerfile.prod .
#   podman build -t ghcr.io/<owner>/openthreat-frontend:local frontend -f frontend/Dockerfile.prod
#   OT_IMAGE_TAG=local podman-compose up -d
#
# All settings come from .env (see .env.vps.example).

x-backend-image: &backend-image ${OT_REGISTRY:-ghcr.io/raasu258}/openthreat-backend:${OT_IMAGE_TAG:-main}

x-db-env: &db-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-openthreat}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-openthreat}
  REDIS_URL: redis://redis:6379

services:
  nginx:
    image: docker.io/library/nginx:alpine
    ports:
      - "${NGINX_HTTP_PORT:-8082}:80"
      - "${NGINX_HTTPS_PORT:-8443}:443"
    environment:
      # nginx.conf is rendered from a template at start so the HTTP->HTTPS
      # redirect knows the public port. Only NGINX_PUBLIC_* is substituted;
      # nginx's own $host etc. are left alone.
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
      NGINX_ENVSUBST_FILTER: ^NGINX_PUBLIC_
      NGINX_PUBLIC_HTTPS_PORT: ${NGINX_HTTPS_PORT:-8443}
    volumes:
      # :Z gives the files a private SELinux label for this container
      - ./nginx/nginx.conf:/etc/nginx/templates/nginx.conf.template:ro,Z
      - ./nginx/ssl:/etc/nginx/ssl:ro,Z
      - nginx_cache:/var/cache/nginx
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - openthreat-network

  frontend:
    image: ${OT_REGISTRY:-ghcr.io/raasu258}/openthreat-frontend:${OT_IMAGE_TAG:-main}
    environment:
      NODE_ENV: production
      # Server-side rendering talks to the backend directly; the browser
      # uses same-origin /api/... through nginx.
      API_URL: http://backend:8001
    restart: unless-stopped
    networks:
      - openthreat-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  backend:
    image: *backend-image
    environment:
      <<: *db-env
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      OLLAMA_HOST: ${OLLAMA_HOST:-}
      SECRET_KEY: ${SECRET_KEY}
      CSRF_SECRET_KEY: ${CSRF_SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      NVD_API_KEY: ${NVD_API_KEY:-}
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-OpenThreat}
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    networks:
      - openthreat-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openthreat}
      POSTGRES_USER: ${POSTGRES_USER:-openthreat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Not published to the host - only reachable inside openthreat-network.
    # Admin shell: podman-compose exec postgres sh -c 'psql -U "$POSTGRES_USER" "$POSTGRES_DB"'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - openthreat-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c maintenance_work_mem=128MB
      -c max_connections=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200

  redis:
    image: docker.io/library/redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save 60 1000
    # Not published to the host - only reachable inside openthreat-network.
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - openthreat-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  celery-worker:
    image: *backend-image
    command: celery -A backend.celery_app worker --loglevel=info --concurrency=1
    environment:
      <<: *db-env
      OLLAMA_HOST: ${OLLAMA_HOST:-}
      LLM_MODEL: ${LLM_MODEL:-}
      NVD_API_KEY: ${NVD_API_KEY:-}
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    networks:
      - openthreat-network
    healthcheck:
      test: ["CMD-SHELL", "celery -A backend.celery_app inspect ping -d celery@$$HOSTNAME | grep -q pong"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G

  celery-beat:
    image: *backend-image
    command: celery -A backend.celery_app beat --loglevel=info --schedule /tmp/celerybeat-schedule
    environment:
      <<: *db-env
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    networks:
      - openthreat-network
    healthcheck:
      # beat has no ping; check that the beat process is alive (the slim
      # image has no pgrep). Overrides the image's HTTP healthcheck.
      test: ["CMD", "python", "-c", "import os,sys; sys.exit(0 if any(b'beat' in open('/proc/'+p+'/cmdline','rb').read() for p in os.listdir('/proc') if p.isdigit()) else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  # Ollama: either run it here (uncomment, and set OLLAMA_HOST=http://ollama:11434)
  # or point OLLAMA_HOST at an existing inference server. Never publish 11434.
  # ollama:
  #   image: docker.io/ollama/ollama:latest
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   environment:
  #     - OLLAMA_NUM_PARALLEL=4
  #     - OLLAMA_MAX_LOADED_MODELS=1
  #   restart: unless-stopped
  #   networks:
  #     - openthreat-network
  #   deploy:
  #     resources:
  #       limits:
  #         cpus: '2.0'
  #         memory: 4G

volumes:
  postgres_data:
  redis_data:
  nginx_cache:
  # ollama_data:

networks:
  openthreat-network:
    driver: bridge
